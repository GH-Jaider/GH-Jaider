# Keeps the repository snapshot (stars, descriptions, `git log`) from going stale: once a week it
# reruns the generator and commits only if something other than the snapshot date changed.
name: Refresh profile snapshot

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # og.png is left alone: it only changes when profile.json does, and that is regenerated locally.
      - run: node scripts/generate.mjs --no-og
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the snapshot really changed
        run: |
          if git diff --quiet -I 'REPOS_AT'; then
            echo "Nothing but the snapshot date changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh repo snapshot"
          git push
